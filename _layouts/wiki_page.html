<script type="text/javascript">
var tmp = $(window).height()*0.07;
var offset = $("#leftblock").offset();
$(document).ready(function(){
	$(window).scroll(function(){
		if($(window).scrollTop()>offset.top){
			$("#leftblock").stop().animate({
				marginTop:$(window).scrollTop()-offset.top+tmp
			});
			$("#rightblock").stop().animate({
				marginTop:$(window).scrollTop()-offset.top+tmp
			});
		}else{
			$("#leftblock").stop().animate({
				marginTop: tmp
			});
			$("#rightblock").stop().animate({
				marginTop: tmp
			});
		}
	});
});
</script>
