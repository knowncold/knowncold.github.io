<script type="text/javascript">
var offset = $("#leftblock").offset();
$(document).ready(function(){
	$(window).scroll(function(){
		if($(window).scrollTop()>offset.top){
			$("#leftblock").stop().animate({
				marginTop:$(window).scrollTop()-offset.top+100
			});
		}else{
			$("#leftblock").stop().animate({
				marginTop:100
			});
		}
	});
});
</script>
