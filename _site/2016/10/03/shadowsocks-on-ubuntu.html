<h2>Ubuntu使用ShadowSocks</h2>

<h3 id="gui">GUI版安装</h3>
<div class="highlighter-rouge"><pre class="highlight"><code>sudo add-apt-repository ppa:hzwhuang/ss-qt5
sudo apt-get update
sudo apt-get install shadowsocks-qt5
</code></pre>
</div>

<h3 id="section">使用</h3>
<p>chrome 可以通过<code class="highlighter-rouge">SwitchyOmega</code>插件来实现本地端口的代理<br />
其他软件可以通过<code class="highlighter-rouge">系统设置&gt;代理</code>来实现代理</p>
