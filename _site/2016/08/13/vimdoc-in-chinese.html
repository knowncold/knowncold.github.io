<h2>Vim中文文档</h2>

<h3 id="vundle">Vundle</h3>
<p>在vimrc中添加</p>

<div class="highlighter-rouge"><pre class="highlight"><code>Plugin 'vimcn/vimcdoc'
</code></pre>
</div>

<p>重启后normal模式下输入</p>

<div class="highlighter-rouge"><pre class="highlight"><code>:PluginInstall
</code></pre>
</div>

<p>别忘了在vimrc中设置help语言</p>

<div class="highlighter-rouge"><pre class="highlight"><code>:set helplang=cn
</code></pre>
</div>

<h3 id="section">参考:</h3>
