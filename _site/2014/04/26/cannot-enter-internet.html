<h2>Ubuntu安装后无法联网</h2>

<p>其实安装的时候也无法联网，导致许多软件包是后面装的。</p>

<p>这个原因主要发生在一些公共场所，尤其是机房，由于局域网的设定，无法自动获取IP地址，所以查看编辑连接的时候，一些空都是空的。</p>

<p>那么就需要编辑网络，选择IPv4设置，方法改成手动，在下面填上地址、子网掩码、网关、DNS之类的，这些数据需要从原来的XP系统里面得到，不同的电脑应该是有点不同的（机房设置）。</p>

<p>选择连接这个网络应该就成功了。</p>
