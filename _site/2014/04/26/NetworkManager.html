<h2>网络服务与管理器不兼容</h2>

<p>成功连上网以后，手贱更新了所有的软件。</p>

<p>第二天开机的时候，发现没有网络连接那个小图标了！</p>

<p>打开系统设置&gt;网络,	出现“系统的网络服务器与此版本的网络管理器不兼容”。</p>

<p>找到一篇文章。</p>

<div class="highlighter-rouge"><pre class="highlight"><code>$ sudo su
# cd /etc/NetworkManager/system-connections/
# ls -la
# mv &lt;filename&gt; /home/&lt;username&gt;/
# NetworkManager
</code></pre>
</div>

<p>终于出现久违的小图标了。</p>
