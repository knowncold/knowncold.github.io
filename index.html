    {% for post in paginator.posts %}
	<div class="blog_left">
	<h1><a href= {{ post.url }}> {{ post.title }} </a></h1>
	<div style="white-space: nowrap;">
	<h4 style="float: left">{{ post.date | date: "%B %d, %Y" }} 发布在 <a style="text-decoration: none;color: #444;">{{ post.category }}</a></h4>
	</div>
	<div class="article">
		{{ post.content }}
	</div>
	<div class="blog_foot">
	<a href= {{ post.url }} >阅读更多</a>
	</div>
	</div>
    {% endfor %}
